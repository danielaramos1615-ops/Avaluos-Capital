<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Dependencias y Servicios</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #d97373;
            --text-main: #333333;
            --text-muted: #888888;
            --border-color: #eeeeee;
            --bg-color: #fcfcfc;
            --danger-color: #ff6b6b;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.04);
        }

        h1, h2 {
            font-weight: 600;
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        h2 {
            margin-top: 30px;
            font-size: 18px;
        }

        /* --- SECCIÓN SUPERIOR (CÓDIGO OBLIGATORIO Y DESCARGA) --- */
        .top-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        @media (min-width: 600px) {
            .top-controls {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
            .top-controls h1 { margin-bottom: 0; }
        }

        .export-group {
            display: flex;
            gap: 8px;
            align-items: center;
            width: 100%;
        }

        .code-input {
            padding: 10px 12px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            border: 2px solid var(--primary-color);
            border-radius: 8px;
            flex-grow: 1;
            text-transform: uppercase;
        }

        .code-input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(217, 115, 115, 0.2);
        }

        .btn-primary {
            background: var(--text-main);
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        /* --- CUADRO DE PREGUNTAS --- */
        .question-box {
            background: #f9f9f9;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            width: fit-content;
        }

        .question-box label {
            font-weight: 500;
            font-size: 14px;
        }

        .radio-group {
            display: flex;
            gap: 15px;
        }

        .radio-group label {
            font-weight: 400;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        /* --- DISEÑO DE LA TABLA COMPACTA --- */
        .table-responsive {
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 15px;
            width: 100%;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        #servicios-table {
            width: fit-content;
            min-width: 100%;
        }

        th, td {
            padding: 6px 4px;
            text-align: center;
            vertical-align: middle;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap;
        }

        th {
            font-weight: 500;
            color: var(--text-muted);
            font-size: 13px;
            background-color: #ffffff;
        }

        th:first-child, td:first-child {
            text-align: left;
            padding-left: 10px;
            width: 1%;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        input[type="text"].editable-text {
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 13px;
            color: var(--text-main);
            width: 100%;
            min-width: 110px;
            padding: 4px;
            border-radius: 4px;
        }

        input[type="text"].editable-text:focus {
            outline: none;
            background: #f0f0f0;
        }

        .cell-number-input {
            width: 30px;
            height: 30px;
            text-align: center;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            color: var(--text-main);
            background: #fff;
            margin: 0 auto;
            display: block;
        }

        .cell-number-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* --- BOTONES DE ELIMINAR --- */
        .btn-del-row, .btn-del-col {
            background: #ffe5e5;
            color: var(--danger-color);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            font-weight: bold;
            padding: 2px 6px;
            margin-left: 5px;
            transition: all 0.2s;
        }
        
        .btn-del-col {
            margin-left: 6px;
            padding: 0px 5px;
            font-size: 11px;
        }

        .btn-del-row:hover, .btn-del-col:hover {
            background: var(--danger-color);
            color: white;
        }

        /* --- CHECKBOXES --- */
        .checkbox-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            background-color: #fff;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        input[type="checkbox"]:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        input[type="checkbox"]:checked::after {
            content: '';
            width: 6px;
            height: 12px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            margin-bottom: 3px;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .btn-action {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #e0e0e0;
            background: #ffffff;
            color: #555;
        }

        #servicios-section {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- 1. CÓDIGO OBLIGATORIO Y DESCARGA -->
    <div class="top-controls">
        <h1>Registro de Inmueble</h1>
        <div class="export-group">
            <input type="text" id="codigoInput" class="code-input" placeholder="CÓDIGO OBLIGATORIO * (EJ: ENE120102)" required>
            <button class="btn-primary" onclick="descargarExcel()">Descargar Excel</button>
        </div>
    </div>

    <!-- 2. SELECCIÓN DE TIPO DE INMUEBLE -->
    <div class="question-box" style="border-color: var(--primary-color); background: #fff5f5;">
        <label>Tipo de Inmueble:</label>
        <div class="radio-group">
            <label><input type="radio" name="tipoInmueble" value="residencial" checked> Residencial</label>
            <label><input type="radio" name="tipoInmueble" value="comercial"> Comercial</label>
        </div>
    </div>
    
    <!-- TABLA DEPENDENCIAS -->
    <div class="table-responsive">
        <table id="dependencias-table">
            <thead>
                <tr id="dependencias-header">
                    <th>Dependencia / Pisos</th>
                </tr>
            </thead>
            <tbody id="dependencias-body">
                <!-- Se llena con JS -->
            </tbody>
        </table>
    </div>
    
    <div class="actions">
        <button class="btn-action" onclick="agregarFila()">+ Añadir Fila</button>
        <button class="btn-action" onclick="agregarColumna()">+ Añadir Piso</button>
    </div>

    <!-- PREGUNTA Y SERVICIOS -->
    <div class="question-box">
        <label>¿Tiene servicios comunales?</label>
        <div class="radio-group">
            <label><input type="radio" name="tieneServicios" value="no" checked> No</label>
            <label><input type="radio" name="tieneServicios" value="si"> Sí</label>
        </div>
    </div>

    <div id="servicios-section">
        <h2>Servicios Comunales</h2>
        <div class="table-responsive">
            <table id="servicios-table">
                <thead>
                    <tr>
                        <th>Servicio</th>
                        <th>Incluido</th>
                    </tr>
                </thead>
                <tbody id="servicios-body">
                    <!-- Se llena con JS -->
                </tbody>
            </table>
        </div>
        <div class="actions">
            <button class="btn-action" onclick="agregarServicio()">+ Añadir Servicio</button>
        </div>
    </div>

</div>

<script>
    // --- BASES DE DATOS DE DEPENDENCIAS ---
    const dependenciasResidenciales = [
        "Hall acceso", "Sala", "Comedor", "Cocina", "Zona de ropas", 
        "Patio", "Antejardín", "Balcón", "Garaje cubierto", "Garaje descubierto", 
        "Cuarto util", "Deposito", "Alcoba de servicio", "Baño de servicio", 
        "Hall alcobas", "Alcobas", "Baño alcobas", "Baño social", "Star tv", 
        "Estudio", "Bodega"
    ];

    const dependenciasComerciales = [
        "Oficina", "Bodega", "Consultorio", "Local", "Auditorio", "Recepción",
        "Sala de espera", "Hall", "Correspondencia", "Espacio de oficinas",
        "Oficina privada", "Oficina de presidencia / gerencia", "Sala de juntas",
        "Archivo", "Cocineta", "Cafetería", "Baños sociales", "Baño privado",
        "Baño de servicio", "Área de servicios", "Cuarto técnico",
        "Cuarto técnico de mecánica", "Cuarto de máquinas",
        "Cuarto de máquinas de ascensores", "Tanques de agua", "Terraza", "Balcón"
    ];

    const serviciosIniciales = [
        "LOBBY", "RECEPCIÓN", "SALÓN SOCIAL", "ZONAS VERDES", "ADMINISTRACIÓN",
        "ASCENSOR", "CITÓFONO", "GIMNASIO", "ZONAS HÚMEDAS", "PISCINA",
        "TURCO", "SAUNA", "SALÓN DE JUEGOS", "PARQUE INFANTIL", "DUCTO DE BASURAS (SHUT)",
        "ZONA DE ASADO (BBQ)", "EQUIPOS DE PRESIÓN", "SUBESTACIÓN ELÉCTRICA", 
        "CUARTO BOMBAS", "CIRC. CERRADO T.V.", "TERRAZA COMUNAL", "CANCHA MÚLTIPLE",
        "CANCHA DE FÚTBOL", "CANCHA DE BÁSQUET", "CANCHA DE SQUASH", "CANCHA DE TENIS",
        "PARQUEADERO VISITANTES", "PARQUEADERO COMÚN RESIDENTES"
    ];

    // --- VARIABLES DE ESTADO ---
    let numPisos = 5; 
    let currentDependencias = dependenciasResidenciales; // Por defecto residencial

    // --- FUNCIONES DE CREACIÓN DE ELEMENTOS ---
    function crearInputNumero() {
        const input = document.createElement('input');
        input.type = 'text';
        input.inputMode = 'numeric';
        input.className = 'cell-number-input';
        input.maxLength = 2;
        return input;
    }

    function crearCheckbox() {
        const wrapper = document.createElement('div');
        wrapper.className = 'checkbox-wrapper';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        wrapper.appendChild(cb);
        return wrapper;
    }

    // --- RENDERIZADO DE LA TABLA DE DEPENDENCIAS ---
    function renderizarTablaDependencias() {
        const headerRow = document.getElementById('dependencias-header');
        const tbody = document.getElementById('dependencias-body');

        // Limpiar tabla existente
        headerRow.innerHTML = '<th>Dependencia / Pisos</th>';
        tbody.innerHTML = '';

        // Crear encabezados de pisos con botón de eliminar
        for (let i = 1; i <= numPisos; i++) {
            const th = document.createElement('th');
            th.innerHTML = `${i} <button class="btn-del-col" onclick="eliminarColumna(this)">×</button>`;
            headerRow.appendChild(th);
        }

        // Crear filas de dependencias
        currentDependencias.forEach(dep => {
            const tr = document.createElement('tr');
            
            // Columna de nombre con botón de eliminar
            const tdNombre = document.createElement('td');
            tdNombre.innerHTML = `<input type="text" value="${dep}" class="editable-text"> <button class="btn-del-row" onclick="eliminarFila(this)">×</button>`;
            tr.appendChild(tdNombre);

            // Columnas de inputs numéricos
            for (let i = 1; i <= numPisos; i++) {
                const td = document.createElement('td');
                td.appendChild(crearInputNumero());
                tr.appendChild(td);
            }
            tbody.appendChild(tr);
        });
    }

    function inicializarServicios() {
        const tbody = document.getElementById('servicios-body');
        tbody.innerHTML = '';
        serviciosIniciales.forEach(serv => {
            agregarFilaServicio(serv);
        });
    }

    function agregarFilaServicio(nombre = '') {
        const tbody = document.getElementById('servicios-body');
        const tr = document.createElement('tr');
        
        const tdNombre = document.createElement('td');
        const inputNombre = document.createElement('input');
        inputNombre.type = 'text';
        inputNombre.value = nombre;
        inputNombre.placeholder = "Nombre del servicio";
        inputNombre.className = 'editable-text';
        tdNombre.appendChild(inputNombre);
        
        const tdCheck = document.createElement('td');
        tdCheck.appendChild(crearCheckbox());

        tr.appendChild(tdNombre);
        tr.appendChild(tdCheck);
        tbody.appendChild(tr);
    }

    // --- FUNCIONES DE AGREGAR ---
    function agregarFila() {
        const tbody = document.getElementById('dependencias-body');
        const headerRow = document.getElementById('dependencias-header');
        const totalColumnas = headerRow.children.length - 1;
        
        const tr = document.createElement('tr');
        
        const tdNombre = document.createElement('td');
        tdNombre.innerHTML = `<input type="text" placeholder="Nueva dependencia" class="editable-text"> <button class="btn-del-row" onclick="eliminarFila(this)">×</button>`;
        tr.appendChild(tdNombre);

        for (let i = 0; i < totalColumnas; i++) {
            const td = document.createElement('td');
            td.appendChild(crearInputNumero());
            tr.appendChild(td);
        }
        tbody.appendChild(tr);
    }

    function agregarColumna() {
        const headerRow = document.getElementById('dependencias-header');
        const tbody = document.getElementById('dependencias-body');
        const newColNum = headerRow.children.length; // El número de columnas actuales + 1

        // Agregar encabezado con botón de eliminar
        const th = document.createElement('th');
        th.innerHTML = `${newColNum} <button class="btn-del-col" onclick="eliminarColumna(this)">×</button>`;
        headerRow.appendChild(th);

        // Agregar celda a cada fila
        const filas = tbody.querySelectorAll('tr');
        filas.forEach(tr => {
            const td = document.createElement('td');
            td.appendChild(crearInputNumero());
            tr.appendChild(td);
        });
        numPisos++;
    }

    function agregarServicio() {
        agregarFilaServicio();
    }

    // --- FUNCIONES DE ELIMINAR ---
    function eliminarFila(btn) {
        if (confirm("¿Estás seguro de que quieres eliminar esta fila?")) {
            btn.closest('tr').remove();
        }
    }

    function eliminarColumna(btn) {
        if (confirm("¿Estás seguro de que quieres eliminar este piso/columna?")) {
            const th = btn.parentElement;
            const index = Array.from(th.parentElement.children).indexOf(th);
            
            // Eliminar encabezado
            th.remove();
            
            // Eliminar celdas de todas las filas
            const rows = document.querySelectorAll('#dependencias-body tr');
            rows.forEach(row => {
                if (row.cells[index]) {
                    row.deleteCell(index);
                }
            });
            
            numPisos--;
            
            // Renumerar encabezados restantes
            const remainingThs = document.querySelectorAll('#dependencias-header th');
            for (let i = 1; i < remainingThs.length; i++) {
                remainingThs[i].innerHTML = `${i} <button class="btn-del-col" onclick="eliminarColumna(this)">×</button>`;
            }
        }
    }

    // --- LÓGICA DE TIPO DE INMUEBLE ---
    document.querySelectorAll('input[name="tipoInmueble"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
            if (e.target.value === 'residencial') {
                currentDependencias = dependenciasResidenciales;
            } else {
                currentDependencias = dependenciasComerciales;
            }
            numPisos = 5; // Reiniciar a 5 pisos por defecto al cambiar
            renderizarTablaDependencias();
        });
    });

    // --- LÓGICA DE SERVICIOS COMUNALES ---
    document.querySelectorAll('input[name="tieneServicios"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
            const seccionServicios = document.getElementById('servicios-section');
            if (e.target.value === 'si') {
                seccionServicios.style.display = 'block';
            } else {
                seccionServicios.style.display = 'none';
            }
        });
    });

    // --- EXPORTACIÓN A EXCEL ---
    function descargarExcel() {
        const codigoInput = document.getElementById('codigoInput');
        const codigo = codigoInput.value.trim().toUpperCase();
        const regexCodigo = /^[A-Z]{3}\d{6}$/;

        if (codigo === '') {
            alert("⚠️ El campo 'CÓDIGO' es obligatorio para poder descargar el Excel.");
            codigoInput.focus();
            return;
        }

        if (!regexCodigo.test(codigo)) {
            alert("⚠️ El código ingresado no es válido.\nDebe tener 3 letras y 6 números (Ejemplo: ENE120102).");
            codigoInput.focus();
            return;
        }

        const wb = XLSX.utils.book_new();

        // --- Hoja 1: Dependencias ---
        const datosDependencias = [];
        const headersDep = [];
        
        // Extraer encabezados (Ignorando el botón de eliminar)
        document.querySelectorAll('#dependencias-header th').forEach((th, index) => {
            if (index === 0) {
                headersDep.push("Dependencia / Pisos");
            } else {
                headersDep.push(th.childNodes[0].textContent.trim());
            }
        });
        datosDependencias.push(headersDep);

        // Extraer filas
        document.querySelectorAll('#dependencias-body tr').forEach(tr => {
            const filaData = [];
            // Extraer el nombre de la dependencia (primer input de texto)
            filaData.push(tr.querySelector('input[type="text"]').value);
            
            // Extraer los valores de los inputs numéricos
            tr.querySelectorAll('.cell-number-input').forEach(input => {
                filaData.push(input.value);
            });
            datosDependencias.push(filaData);
        });

        const wsDep = XLSX.utils.aoa_to_sheet(datosDependencias);
        XLSX.utils.book_append_sheet(wb, wsDep, "Dependencias");

        // --- Hoja 2: Servicios Comunales ---
        const tieneServicios = document.querySelector('input[name="tieneServicios"]:checked').value === 'si';
        
        if (tieneServicios) {
            const datosServicios = [["Servicio", "Incluido"]];
            document.querySelectorAll('#servicios-body tr').forEach(tr => {
                const nombre = tr.querySelector('input[type="text"]').value;
                const marcado = tr.querySelector('input[type="checkbox"]').checked ? 'X' : '';
                datosServicios.push([nombre, marcado]);
            });

            const wsServ = XLSX.utils.aoa_to_sheet(datosServicios);
            XLSX.utils.book_append_sheet(wb, wsServ, "Servicios Comunales");
        }

        XLSX.writeFile(wb, `Registro_Inmueble_${codigo}.xlsx`);
    }

    // --- INICIALIZACIÓN ---
    window.onload = function() {
        renderizarTablaDependencias();
        inicializarServicios();
    };
</script>

</body>
</html>
