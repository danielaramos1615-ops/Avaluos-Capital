<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Dependencias y Servicios</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #d97373;
            --text-main: #333333;
            --text-muted: #888888;
            --border-color: #eeeeee;
            --bg-color: #fcfcfc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 15px;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: #ffffff;
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.04);
        }

        h1, h2 {
            font-weight: 600;
            font-size: 20px;
            margin-top: 0;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        h2 {
            margin-top: 30px;
            font-size: 18px;
        }

        /* --- SECCIÓN SUPERIOR (CÓDIGO OBLIGATORIO Y DESCARGA) --- */
        .top-controls {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 15px;
            border-bottom: 1px solid var(--border-color);
        }

        @media (min-width: 600px) {
            .top-controls {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
            }
            .top-controls h1 { margin-bottom: 0; }
        }

        .export-group {
            display: flex;
            gap: 8px;
            align-items: center;
            width: 100%;
        }

        .code-input {
            padding: 10px 12px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            border: 2px solid var(--primary-color); /* Borde rojo para indicar obligatorio */
            border-radius: 8px;
            flex-grow: 1;
            text-transform: uppercase;
        }

        .code-input:focus {
            outline: none;
            box-shadow: 0 0 0 3px rgba(217, 115, 115, 0.2);
        }

        .btn-primary {
            background: var(--text-main);
            color: white;
            border: none;
            padding: 10px 15px;
            font-size: 14px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            white-space: nowrap;
        }

        /* --- DISEÑO DE LA TABLA (COMPACTO COMO LA IMAGEN DE FRUTAS) --- */
        .table-responsive {
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 15px;
            width: 100%;
        }

        table {
            border-collapse: collapse;
            width: 100%;
        }

        /* Hace que la tabla de servicios se encoja y no estire sus columnas */
        #servicios-table {
            width: fit-content;
            min-width: 100%; /* En celular ocupa el 100%, en PC se encoje si hay poco contenido */
        }

        th, td {
            padding: 6px 4px; /* ¡Súper reducido para que queden juntos! */
            text-align: center;
            vertical-align: middle;
            border-bottom: 1px solid var(--border-color);
            white-space: nowrap; /* Evita que el texto se parta en dos líneas */
        }

        th {
            font-weight: 500;
            color: var(--text-muted);
            font-size: 13px;
            background-color: #ffffff;
        }

        /* La primera columna se encoge al tamaño justo del texto */
        th:first-child, td:first-child {
            text-align: left;
            padding-left: 10px;
            width: 1%; /* Magia de CSS para que sea lo más pequeña posible */
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        /* Input de texto editable (ocupa el tamaño de su columna) */
        input[type="text"].editable-text {
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 13px;
            color: var(--text-main);
            width: 100%;
            min-width: 110px; /* Tamaño mínimo para poder tocar en celular */
            padding: 4px;
            border-radius: 4px;
        }

        input[type="text"].editable-text:focus {
            outline: none;
            background: #f0f0f0;
        }

        /* Cuadros numéricos compactos */
        .cell-number-input {
            width: 30px;
            height: 30px;
            text-align: center;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            color: var(--text-main);
            background: #fff;
            margin: 0 auto;
            display: block;
        }

        .cell-number-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        /* Checkboxes grandes y juntos */
        .checkbox-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
        }

        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 28px; /* Más grande para ver bien en móvil */
            height: 28px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            background-color: #fff;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            margin: 0;
        }

        input[type="checkbox"]:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        input[type="checkbox"]:checked::after {
            content: '';
            width: 6px;
            height: 12px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            margin-bottom: 3px;
        }

        .actions {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
        }

        .btn-action {
            font-family: 'Inter', sans-serif;
            font-size: 13px;
            font-weight: 500;
            padding: 8px 12px;
            border-radius: 6px;
            cursor: pointer;
            border: 1px solid #e0e0e0;
            background: #ffffff;
            color: #555;
        }

        /* --- PREGUNTA CONDICIONAL --- */
        .question-box {
            background: #f9f9f9;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            margin-top: 20px;
            width: fit-content; /* Para que no ocupe todo el ancho si no es necesario */
        }

        .question-box label {
            font-weight: 500;
            font-size: 14px;
        }

        .radio-group {
            display: flex;
            gap: 15px;
        }

        .radio-group label {
            font-weight: 400;
            font-size: 14px;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        #servicios-section {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- CONTROLES SUPERIORES (Código obligatorio y descarga) -->
    <div class="top-controls">
        <h1>Distribución y Dependencias</h1>
        <div class="export-group">
            <!-- El asterisco indica que es obligatorio -->
            <input type="text" id="codigoInput" class="code-input" placeholder="CÓDIGO OBLIGATORIO * (EJ: ENE120102)" required>
            <button class="btn-primary" onclick="descargarExcel()">Descargar Excel</button>
        </div>
    </div>
    
    <!-- TABLA DEPENDENCIAS -->
    <div class="table-responsive">
        <table id="dependencias-table">
            <thead>
                <tr id="dependencias-header">
                    <th>Dependencia / Pisos</th>
                </tr>
            </thead>
            <tbody id="dependencias-body">
                <!-- Se llena con JS -->
            </tbody>
        </table>
    </div>
    
    <div class="actions">
        <button class="btn-action" onclick="agregarFila()">+ Añadir Dependencia</button>
        <button class="btn-action" onclick="agregarColumna()">+ Añadir Piso</button>
    </div>

    <!-- PREGUNTA Y SERVICIOS -->
    <div class="question-box">
        <label>¿Tiene servicios comunales?</label>
        <div class="radio-group">
            <label><input type="radio" name="tieneServicios" value="no" checked> No</label>
            <label><input type="radio" name="tieneServicios" value="si"> Sí</label>
        </div>
    </div>

    <div id="servicios-section">
        <h2>Servicios Comunales</h2>
        <div class="table-responsive">
            <table id="servicios-table">
                <thead>
                    <tr>
                        <th>Servicio</th>
                        <th>Incluido</th>
                    </tr>
                </thead>
                <tbody id="servicios-body">
                    <!-- Se llena con JS -->
                </tbody>
            </table>
        </div>
        <div class="actions">
            <button class="btn-action" onclick="agregarServicio()">+ Añadir Servicio</button>
        </div>
    </div>

</div>

<script>
    const dependenciasIniciales = [
        "Hall acceso", "Sala", "Comedor", "Cocina", "Zona de ropas", 
        "Patio", "Antejardín", "Balcón", "Garaje cubierto", "Garaje descubierto", 
        "Cuarto util", "Deposito", "Alcoba de servicio", "Baño de servicio", 
        "Hall alcobas", "Alcobas", "Baño alcobas", "Baño social", "Star tv", 
        "Estudio", "Bodega"
    ];

    const serviciosIniciales = [
        "LOBBY", "RECEPCIÓN", "SALÓN SOCIAL", "ZONAS VERDES", "ADMINISTRACIÓN",
        "ASCENSOR", "CITÓFONO", "GIMNASIO", "ZONAS HÚMEDAS", "PISCINA",
        "TURCO", "SAUNA", "SALÓN DE JUEGOS", "PARQUE INFANTIL", "DUCTO DE BASURAS (SHUT)",
        "ZONA DE ASADO (BBQ)", "EQUIPOS DE PRESIÓN", "SUBESTACIÓN ELÉCTRICA", 
        "CUARTO BOMBAS", "CIRC. CERRADO T.V.", "TERRAZA COMUNAL", "CANCHA MÚLTIPLE",
        "CANCHA DE FÚTBOL", "CANCHA DE BÁSQUET", "CANCHA DE SQUASH", "CANCHA DE TENIS",
        "PARQUEADERO VISITANTES", "PARQUEADERO COMÚN RESIDENTES"
    ];

    let numPisos = 5; 

    function crearInputNumero() {
        const input = document.createElement('input');
        input.type = 'text';
        input.inputMode = 'numeric';
        input.className = 'cell-number-input';
        input.maxLength = 2;
        return input;
    }

    function crearCheckbox() {
        const wrapper = document.createElement('div');
        wrapper.className = 'checkbox-wrapper';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        wrapper.appendChild(cb);
        return wrapper;
    }

    function inicializarTabla() {
        const headerRow = document.getElementById('dependencias-header');
        const tbody = document.getElementById('dependencias-body');
        
        for (let i = 1; i <= numPisos; i++) {
            const th = document.createElement('th');
            th.textContent = i;
            headerRow.appendChild(th);
        }

        dependenciasIniciales.forEach(dep => {
            const tr = document.createElement('tr');
            
            const tdNombre = document.createElement('td');
            const inputNombre = document.createElement('input');
            inputNombre.type = 'text';
            inputNombre.value = dep;
            inputNombre.className = 'editable-text';
            tdNombre.appendChild(inputNombre);
            tr.appendChild(tdNombre);

            for (let i = 1; i <= numPisos; i++) {
                const td = document.createElement('td');
                td.appendChild(crearInputNumero());
                tr.appendChild(td);
            }
            tbody.appendChild(tr);
        });
    }

    function inicializarServicios() {
        serviciosIniciales.forEach(serv => {
            agregarFilaServicio(serv);
        });
    }

    function agregarFilaServicio(nombre = '') {
        const tbody = document.getElementById('servicios-body');
        const tr = document.createElement('tr');
        
        const tdNombre = document.createElement('td');
        const inputNombre = document.createElement('input');
        inputNombre.type = 'text';
        inputNombre.value = nombre;
        inputNombre.placeholder = "Nombre del servicio";
        inputNombre.className = 'editable-text';
        tdNombre.appendChild(inputNombre);
        
        const tdCheck = document.createElement('td');
        tdCheck.appendChild(crearCheckbox());

        tr.appendChild(tdNombre);
        tr.appendChild(tdCheck);
        tbody.appendChild(tr);
    }

    function agregarFila() {
        const tbody = document.getElementById('dependencias-body');
        const tr = document.createElement('tr');
        
        const tdNombre = document.createElement('td');
        const inputNombre = document.createElement('input');
        inputNombre.type = 'text';
        inputNombre.placeholder = 'Nueva dependencia';
        inputNombre.className = 'editable-text';
        tdNombre.appendChild(inputNombre);
        tr.appendChild(tdNombre);

        const totalColumnas = document.getElementById('dependencias-header').children.length - 1;
        for (let i = 1; i <= totalColumnas; i++) {
            const td = document.createElement('td');
            td.appendChild(crearInputNumero());
            tr.appendChild(td);
        }
        tbody.appendChild(tr);
    }

    function agregarColumna() {
        numPisos++;
        const headerRow = document.getElementById('dependencias-header');
        const tbody = document.getElementById('dependencias-body');

        const th = document.createElement('th');
        th.textContent = numPisos;
        headerRow.appendChild(th);

        const filas = tbody.querySelectorAll('tr');
        filas.forEach(tr => {
            const td = document.createElement('td');
            td.appendChild(crearInputNumero());
            tr.appendChild(td);
        });
    }

    function agregarServicio() {
        agregarFilaServicio();
    }

    document.querySelectorAll('input[name="tieneServicios"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
            const seccionServicios = document.getElementById('servicios-section');
            if (e.target.value === 'si') {
                seccionServicios.style.display = 'block';
            } else {
                seccionServicios.style.display = 'none';
            }
        });
    });

    function descargarExcel() {
        const codigoInput = document.getElementById('codigoInput');
        const codigo = codigoInput.value.trim().toUpperCase();
        const regexCodigo = /^[A-Z]{3}\d{6}$/;

        // VALIDACIÓN OBLIGATORIA
        if (codigo === '') {
            alert("⚠️ El campo 'CÓDIGO' es obligatorio para poder descargar el Excel.");
            codigoInput.focus();
            return;
        }

        if (!regexCodigo.test(codigo)) {
            alert("⚠️ El código ingresado no es válido.\nDebe tener 3 letras y 6 números (Ejemplo: ENE120102).");
            codigoInput.focus();
            return;
        }

        const wb = XLSX.utils.book_new();

        // Hoja 1: Dependencias
        const datosDependencias = [];
        const headersDep = [];
        
        document.querySelectorAll('#dependencias-header th').forEach(th => headersDep.push(th.textContent));
        datosDependencias.push(headersDep);

        document.querySelectorAll('#dependencias-body tr').forEach(tr => {
            const filaData = [];
            filaData.push(tr.querySelector('input[type="text"]').value);
            
            tr.querySelectorAll('.cell-number-input').forEach(input => {
                filaData.push(input.value);
            });
            datosDependencias.push(filaData);
        });

        const wsDep = XLSX.utils.aoa_to_sheet(datosDependencias);
        XLSX.utils.book_append_sheet(wb, wsDep, "Dependencias");

        // Hoja 2: Servicios Comunales
        const tieneServicios = document.querySelector('input[name="tieneServicios"]:checked').value === 'si';
        
        if (tieneServicios) {
            const datosServicios = [["Servicio", "Incluido"]];
            document.querySelectorAll('#servicios-body tr').forEach(tr => {
                const nombre = tr.querySelector('input[type="text"]').value;
                const marcado = tr.querySelector('input[type="checkbox"]').checked ? 'X' : '';
                datosServicios.push([nombre, marcado]);
            });

            const wsServ = XLSX.utils.aoa_to_sheet(datosServicios);
            XLSX.utils.book_append_sheet(wb, wsServ, "Servicios Comunales");
        }

        XLSX.writeFile(wb, `Registro_Inmueble_${codigo}.xlsx`);
    }

    window.onload = function() {
        inicializarTabla();
        inicializarServicios();
    };
</script>

</body>
</html>
