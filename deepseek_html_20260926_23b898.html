<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro de Dependencias y Servicios</title>
    <!-- Importar fuente moderna -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Importar SheetJS para generar Excel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
    <style>
        :root {
            --primary-color: #d97373;
            --text-main: #333333;
            --text-muted: #888888;
            --border-color: #eeeeee;
            --bg-color: #fcfcfc;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            padding: 40px 20px;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container {
            width: 100%;
            max-width: 1000px;
            background: #ffffff;
            padding: 40px;
            border-radius: 16px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.04);
        }

        h1, h2 {
            font-weight: 600;
            font-size: 22px;
            margin-top: 0;
            margin-bottom: 20px;
            color: var(--text-main);
        }

        h2 {
            margin-top: 40px;
            font-size: 18px;
        }

        /* --- SECCIÓN SUPERIOR (CÓDIGO Y DESCARGA) --- */
        .top-controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 15px;
            margin-bottom: 20px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border-color);
        }

        .top-controls h1 {
            margin-bottom: 0;
        }

        .export-group {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .code-input {
            padding: 12px 16px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            border: 2px solid #e0e0e0;
            border-radius: 8px;
            width: 220px;
            text-transform: uppercase;
            transition: border 0.2s;
        }

        .code-input:focus {
            outline: none;
            border-color: var(--primary-color);
        }

        .btn-primary {
            background: var(--text-main);
            color: white;
            border: none;
            padding: 12px 24px;
            font-size: 15px;
            font-family: 'Inter', sans-serif;
            font-weight: 500;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }

        .btn-primary:hover {
            background: #000;
        }

        /* --- PREGUNTA CONDICIONAL --- */
        .question-box {
            background: #f9f9f9;
            padding: 15px 20px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 30px;
        }

        .question-box label {
            font-weight: 500;
            font-size: 16px;
        }

        .radio-group {
            display: flex;
            gap: 15px;
        }

        .radio-group label {
            font-weight: 400;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .radio-group input[type="radio"] {
            transform: scale(1.2);
            cursor: pointer;
        }

        /* --- DISEÑO DE LA TABLA --- */
        .table-responsive {
            overflow-x: auto;
            border: 1px solid var(--border-color);
            border-radius: 12px;
            margin-bottom: 15px;
        }

        table {
            border-collapse: collapse;
            width: 100%;
            min-width: 600px;
        }

        th, td {
            padding: 12px 10px;
            text-align: center;
            vertical-align: middle;
            border-bottom: 1px solid var(--border-color);
        }

        th {
            font-weight: 500;
            color: var(--text-muted);
            font-size: 15px;
            background-color: #ffffff;
            padding: 16px 10px;
        }

        th:first-child, td:first-child {
            text-align: left;
            min-width: 200px;
            padding-left: 20px;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        input[type="text"].editable-text {
            border: none;
            background: transparent;
            font-family: inherit;
            font-size: 15px;
            color: var(--text-main);
            width: 100%;
            padding: 5px;
            border-radius: 4px;
            transition: background 0.2s;
        }

        input[type="text"].editable-text:focus {
            outline: none;
            background: #f0f0f0;
        }

        .cell-number-input {
            width: 38px;
            height: 38px;
            text-align: center;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-family: 'Inter', sans-serif;
            font-size: 15px;
            color: var(--text-main);
            background: #fff;
            transition: all 0.2s ease;
            margin: 0 auto;
            display: block;
        }

        .cell-number-input:focus {
            outline: none;
            border-color: var(--primary-color);
            box-shadow: 0 0 0 2px rgba(217, 115, 115, 0.2);
        }

        .checkbox-wrapper {
            display: flex;
            justify-content: center;
            align-items: center;
            width: 100%;
            height: 100%;
        }

        input[type="checkbox"] {
            appearance: none;
            -webkit-appearance: none;
            width: 24px;
            height: 24px;
            border: 2px solid #e0e0e0;
            border-radius: 6px;
            background-color: #fff;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            margin: 0;
        }

        input[type="checkbox"]:hover {
            border-color: #c0c0c0;
        }

        input[type="checkbox"]:checked {
            background-color: var(--primary-color);
            border-color: var(--primary-color);
        }

        input[type="checkbox"]:checked::after {
            content: '';
            width: 5px;
            height: 10px;
            border: solid white;
            border-width: 0 2px 2px 0;
            transform: rotate(45deg);
            margin-bottom: 2px;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 30px;
        }

        .btn-action {
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            font-weight: 500;
            padding: 10px 18px;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #e0e0e0;
            background: #ffffff;
            color: #555;
        }

        .btn-action:hover {
            background: #f9f9f9;
            border-color: #ccc;
        }

        /* Ocultar la sección de servicios por defecto */
        #servicios-section {
            display: none;
        }
    </style>
</head>
<body>

<div class="container">
    
    <!-- CONTROLES SUPERIORES -->
    <div class="top-controls">
        <h1>Distribución y Dependencias</h1>
        <div class="export-group">
            <input type="text" id="codigoInput" class="code-input" placeholder="CÓDIGO (EJ: ENE120102)">
            <button class="btn-primary" onclick="descargarExcel()">Descargar Excel</button>
        </div>
    </div>

    <!-- PREGUNTA CONDICIONAL -->
    <div class="question-box">
        <label>¿Tiene servicios comunales?</label>
        <div class="radio-group">
            <label><input type="radio" name="tieneServicios" value="no" checked> No</label>
            <label><input type="radio" name="tieneServicios" value="si"> Sí</label>
        </div>
    </div>
    
    <!-- TABLA DEPENDENCIAS -->
    <div class="table-responsive">
        <table id="dependencias-table">
            <thead>
                <tr id="dependencias-header">
                    <th>Dependencia / Pisos</th>
                </tr>
            </thead>
            <tbody id="dependencias-body">
                <!-- Se llena con JS -->
            </tbody>
        </table>
    </div>
    
    <div class="actions">
        <button class="btn-action" onclick="agregarFila()">+ Añadir Dependencia</button>
        <button class="btn-action" onclick="agregarColumna()">+ Añadir Piso</button>
    </div>

    <!-- SECCIÓN DE SERVICIOS (OCULTA POR DEFECTO) -->
    <div id="servicios-section">
        <h2>Servicios Comunales</h2>
        <div class="table-responsive">
            <table id="servicios-table">
                <thead>
                    <tr>
                        <th>Servicio</th>
                        <th>Incluido</th>
                    </tr>
                </thead>
                <tbody id="servicios-body">
                    <!-- Se llena con JS -->
                </tbody>
            </table>
        </div>
        <div class="actions">
            <button class="btn-action" onclick="agregarServicio()">+ Añadir Servicio</button>
        </div>
    </div>

</div>

<script>
    // --- DATOS INICIALES ---
    const dependenciasIniciales = [
        "Hall acceso", "Sala", "Comedor", "Cocina", "Zona de ropas", 
        "Patio", "Antejardín", "Balcón", "Garaje cubierto", "Garaje descubierto", 
        "Cuarto util", "Deposito", "Alcoba de servicio", "Baño de servicio", 
        "Hall alcobas", "Alcobas", "Baño alcobas", "Baño social", "Star tv", 
        "Estudio", "Bodega"
    ];

    const serviciosIniciales = [
        "LOBBY", "RECEPCIÓN", "SALÓN SOCIAL", "ZONAS VERDES", "ADMINISTRACIÓN",
        "ASCENSOR", "CITÓFONO", "GIMNASIO", "ZONAS HÚMEDAS", "PISCINA",
        "TURCO", "SAUNA", "SALÓN DE JUEGOS", "PARQUE INFANTIL", "DUCTO DE BASURAS (SHUT)",
        "ZONA DE ASADO (BBQ)", "EQUIPOS DE PRESIÓN", "SUBESTACIÓN ELÉCTRICA", 
        "CUARTO BOMBAS", "CIRC. CERRADO T.V.", "TERRAZA COMUNAL", "CANCHA MÚLTIPLE",
        "CANCHA DE FÚTBOL", "CANCHA DE BÁSQUET", "CANCHA DE SQUASH", "CANCHA DE TENIS",
        "PARQUEADERO VISITANTES", "PARQUEADERO COMÚN RESIDENTES"
    ];

    // --- CAMBIO 1: INICIAR CON 5 PISOS ---
    let numPisos = 5; 

    // --- FUNCIONES DE CREACIÓN DE ELEMENTOS ---
    function crearInputNumero() {
        const input = document.createElement('input');
        input.type = 'text';
        input.inputMode = 'numeric';
        input.className = 'cell-number-input';
        input.maxLength = 2;
        return input;
    }

    function crearCheckbox() {
        const wrapper = document.createElement('div');
        wrapper.className = 'checkbox-wrapper';
        const cb = document.createElement('input');
        cb.type = 'checkbox';
        wrapper.appendChild(cb);
        return wrapper;
    }

    // --- INICIALIZACIÓN DE TABLAS ---
    function inicializarTabla() {
        const headerRow = document.getElementById('dependencias-header');
        const tbody = document.getElementById('dependencias-body');
        
        for (let i = 1; i <= numPisos; i++) {
            const th = document.createElement('th');
            th.textContent = i;
            headerRow.appendChild(th);
        }

        dependenciasIniciales.forEach(dep => {
            const tr = document.createElement('tr');
            
            const tdNombre = document.createElement('td');
            const inputNombre = document.createElement('input');
            inputNombre.type = 'text';
            inputNombre.value = dep;
            inputNombre.className = 'editable-text';
            tdNombre.appendChild(inputNombre);
            tr.appendChild(tdNombre);

            for (let i = 1; i <= numPisos; i++) {
                const td = document.createElement('td');
                td.appendChild(crearInputNumero());
                tr.appendChild(td);
            }
            tbody.appendChild(tr);
        });
    }

    function inicializarServicios() {
        serviciosIniciales.forEach(serv => {
            agregarFilaServicio(serv);
        });
    }

    function agregarFilaServicio(nombre = '') {
        const tbody = document.getElementById('servicios-body');
        const tr = document.createElement('tr');
        
        const tdNombre = document.createElement('td');
        const inputNombre = document.createElement('input');
        inputNombre.type = 'text';
        inputNombre.value = nombre;
        inputNombre.placeholder = "Nombre del servicio";
        inputNombre.className = 'editable-text';
        tdNombre.appendChild(inputNombre);
        
        const tdCheck = document.createElement('td');
        tdCheck.appendChild(crearCheckbox());

        tr.appendChild(tdNombre);
        tr.appendChild(tdCheck);
        tbody.appendChild(tr);
    }

    // --- FUNCIONES DINÁMICAS ---
    function agregarFila() {
        const tbody = document.getElementById('dependencias-body');
        const tr = document.createElement('tr');
        
        const tdNombre = document.createElement('td');
        const inputNombre = document.createElement('input');
        inputNombre.type = 'text';
        inputNombre.placeholder = 'Nueva dependencia';
        inputNombre.className = 'editable-text';
        tdNombre.appendChild(inputNombre);
        tr.appendChild(tdNombre);

        const totalColumnas = document.getElementById('dependencias-header').children.length - 1;
        for (let i = 1; i <= totalColumnas; i++) {
            const td = document.createElement('td');
            td.appendChild(crearInputNumero());
            tr.appendChild(td);
        }
        tbody.appendChild(tr);
    }

    function agregarColumna() {
        numPisos++;
        const headerRow = document.getElementById('dependencias-header');
        const tbody = document.getElementById('dependencias-body');

        const th = document.createElement('th');
        th.textContent = numPisos;
        headerRow.appendChild(th);

        const filas = tbody.querySelectorAll('tr');
        filas.forEach(tr => {
            const td = document.createElement('td');
            td.appendChild(crearInputNumero());
            tr.appendChild(td);
        });
    }

    function agregarServicio() {
        agregarFilaServicio();
    }

    // --- LÓGICA DE LA PREGUNTA CONDICIONAL ---
    document.querySelectorAll('input[name="tieneServicios"]').forEach(radio => {
        radio.addEventListener('change', (e) => {
            const seccionServicios = document.getElementById('servicios-section');
            if (e.target.value === 'si') {
                seccionServicios.style.display = 'block';
            } else {
                seccionServicios.style.display = 'none';
            }
        });
    });

    // --- EXPORTACIÓN A EXCEL ---
    function descargarExcel() {
        const codigo = document.getElementById('codigoInput').value.trim().toUpperCase();
        const regexCodigo = /^[A-Z]{3}\d{6}$/;

        if (!regexCodigo.test(codigo)) {
            alert("⚠️ Error: Debe ingresar un código válido.\nFormato requerido: 3 letras y 6 números (Ejemplo: ENE120102).");
            return;
        }

        const wb = XLSX.utils.book_new();

        // Hoja 1: Dependencias (Siempre se exporta)
        const datosDependencias = [];
        const headersDep = [];
        
        document.querySelectorAll('#dependencias-header th').forEach(th => headersDep.push(th.textContent));
        datosDependencias.push(headersDep);

        document.querySelectorAll('#dependencias-body tr').forEach(tr => {
            const filaData = [];
            filaData.push(tr.querySelector('input[type="text"]').value);
            
            tr.querySelectorAll('.cell-number-input').forEach(input => {
                filaData.push(input.value);
            });
            datosDependencias.push(filaData);
        });

        const wsDep = XLSX.utils.aoa_to_sheet(datosDependencias);
        XLSX.utils.book_append_sheet(wb, wsDep, "Dependencias");

        // Hoja 2: Servicios Comunales (Solo se exporta si la respuesta es "Sí")
        const tieneServicios = document.querySelector('input[name="tieneServicios"]:checked').value === 'si';
        
        if (tieneServicios) {
            const datosServicios = [["Servicio", "Incluido"]];
            document.querySelectorAll('#servicios-body tr').forEach(tr => {
                const nombre = tr.querySelector('input[type="text"]').value;
                const marcado = tr.querySelector('input[type="checkbox"]').checked ? 'X' : '';
                datosServicios.push([nombre, marcado]);
            });

            const wsServ = XLSX.utils.aoa_to_sheet(datosServicios);
            XLSX.utils.book_append_sheet(wb, wsServ, "Servicios Comunales");
        }

        XLSX.writeFile(wb, `Registro_Inmueble_${codigo}.xlsx`);
    }

    // Iniciar aplicación
    window.onload = function() {
        inicializarTabla();
        inicializarServicios();
    };
</script>

</body>
</html>
